<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gatecrash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: full-screen canvas (a causeway seen in perspective) with a thin HUD on top and the
   giant button bottom-right. A single dusk look on purpose, so the page sets every colour itself. */
:root{
  --ink:#1b1430; --dusk:#3a2766; --peach:#f39a6b; --sand:#e9b98a; --deck:#d8cab6;
  --mint:#2ed3ae; --mint-deep:#139a7e; --rose:#ff4e6a; --rose-deep:#b8243f;
  --gold:#ffc63a; --cream:#fff6ea; --glass:#7fe7ff;
  --display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pill{background:rgba(27,20,48,.72);border-radius:999px;padding:4px 14px;font-weight:800;font-size:1.05rem;white-space:nowrap;line-height:1.5}
.pill.coins{color:var(--gold)}
.bar{height:22px;border-radius:11px;background:rgba(27,20,48,.72);position:relative;overflow:hidden;min-width:0}
.bar i{position:absolute;inset:3px auto 3px 3px;border-radius:8px;background:var(--rose);transition:width .15s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.wall{width:min(46vw,220px)}
.wall .bar i{background:var(--mint)}
.wall small{display:block;font-size:.75rem;opacity:.8;margin:0 0 2px 4px;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#giant{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:0;background:conic-gradient(var(--gold) var(--pct,0%),rgba(27,20,48,.75) 0);
  display:grid;place-items:center;padding:0;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#giant b{width:62px;height:62px;border-radius:50%;background:var(--dusk);display:grid;place-items:center;font-size:.8rem;line-height:1;font-weight:800;letter-spacing:.03em}
#giant.ready b{background:var(--gold);color:var(--ink);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#home{pointer-events:auto;background:rgba(27,20,48,.72);border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
#home svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.left{display:flex;gap:8px;align-items:center}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(27,20,48,.55);backdrop-filter:blur(2px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:linear-gradient(180deg,#43307a,#2a1d52);border-radius:24px;padding:24px 22px;width:min(100%,380px);max-height:100%;overflow-y:auto;
  text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.3),0 20px 60px rgba(0,0,0,.4)}
.card h1{margin:0;font-size:3rem;line-height:.9;font-weight:800;letter-spacing:-.01em;color:var(--gold);text-shadow:0 4px 0 #b9541f}
.card h2{margin:0;font-size:2rem;line-height:1;text-wrap:balance}
.card p{margin:0;opacity:.85;line-height:1.35;font-weight:600}
.go{background:var(--mint);color:var(--ink);border:0;border-radius:16px;height:56px;font-size:1.35rem;font-weight:800;box-shadow:0 5px 0 var(--mint-deep)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-deep)}
.sec{background:rgba(255,255,255,.08);border:0;border-radius:14px;height:46px;font-weight:800;font-size:1.05rem}
.ups{display:flex;flex-direction:column;gap:8px;text-align:left}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.up b{font-size:1.05rem}
.up small{grid-column:1;opacity:.75;font-weight:600;font-size:.82rem}
.up button{grid-row:1/3;grid-column:2;border:0;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:800;padding:6px 12px;min-width:84px;box-shadow:0 3px 0 #b9821a}
.up button:disabled{background:rgba(255,255,255,.15);color:rgba(255,246,234,.6);box-shadow:none;cursor:default}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--gold);line-height:1}
.stars .off{color:rgba(255,255,255,.2)}
.gold{color:var(--gold)}
.howto{font-size:.88rem;opacity:.75}
@media (prefers-reduced-motion:reduce){#giant.ready b{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div class="left">
    <button id="home" aria-label="Pause and go to menu"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    <div class="pill" id="lvl">Level 1</div>
  </div>
  <div class="bar" aria-label="Enemy tower health"><i id="baseBar" style="width:100%"></i><span id="baseTxt">Tower</span></div>
  <div class="pill coins" id="coins">● 0</div>
</div>
<div class="bottom" id="bottom" hidden>
  <div class="wall"><small>YOUR GATEHOUSE</small><div class="bar"><i id="wallBar" style="width:100%"></i><span id="wallTxt"></span></div></div>
  <button id="giant" aria-label="Launch a giant"><b>GIANT</b></button>
</div>

<div class="overlay" id="ov"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ============================================================ save
const KEY = 'gatecrash-v1';
let save = { level: 1, coins: 0, up: { rate: 0, volley: 0, giant: 0 }, best: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) save = Object.assign(save, s, { up: Object.assign(save.up, s.up || {}) }); } catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch {} };

const UPGRADES = [
  { k: 'rate', name: 'Fire rate', max: 10, desc: l => `${fireRate(l).toFixed(1)} shots a second`, next: l => fireRate(l).toFixed(1) },
  { k: 'volley', name: 'Volley', max: 4, desc: l => `${1 + l} runner${l ? 's' : ''} per shot`, next: l => 1 + l },
  { k: 'giant', name: 'Giant', max: 6, desc: l => `Charges in ${giantNeed(l)} shots, power ${giantPower(l)}`, next: l => `${giantNeed(l)} shots, power ${giantPower(l)}` },
];
const fireRate = l => 5 + l * 0.8;
const giantNeed = l => 45 - l * 5;
const giantPower = l => 15 + l * 5;
const upCost = (k, l) => Math.round((k === 'volley' ? 90 : 40) * Math.pow(l + 1, 1.6));

// ============================================================ world + projection
// World: x across the causeway (-1..1), z along it (0 = your cannon, L = enemy tower).
const L = 22, R = 0.065, D = 14;
let W = 400, H = 800, dpr = 1, CX = 200, LH = 170, NY = 680, HY = -200;
const cv = $('cv'), ctx = cv.getContext('2d');
const sc = z => D / (D + z);
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  CX = W / 2; LH = Math.min(W * 0.44, H * 0.3); NY = H * 0.84;
  const sF = sc(L), farY = Math.max(H * 0.22, 150);
  HY = (farY - sF * NY) / (1 - sF);
}
addEventListener('resize', resize); resize();
const PX = (x, z) => CX + x * LH * sc(z);
const PY = z => HY + (NY - HY) * sc(z);
const PS = z => LH * sc(z); // pixels per world unit at depth z

// ============================================================ sprites
function makeSprite(body, deep) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(32, 56, 20, 6, 0, 0, 7); g.fill();
  const gr = g.createRadialGradient(24, 22, 4, 32, 32, 28); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.18, body); gr.addColorStop(1, deep);
  g.fillStyle = gr; g.beginPath(); g.moveTo(32, 6); g.bezierCurveTo(56, 6, 58, 34, 54, 46); g.quadraticCurveTo(32, 58, 10, 46); g.bezierCurveTo(6, 34, 8, 6, 32, 6); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(25, 26, 4.5, 6, 0, 0, 7); g.ellipse(39, 26, 4.5, 6, 0, 0, 7); g.fill();
  g.fillStyle = '#1b1430'; g.beginPath(); g.arc(25.5, 28, 2.4, 0, 7); g.arc(39.5, 28, 2.4, 0, 7); g.fill();
  return c;
}
const SPR = { mint: makeSprite('#2ed3ae', '#0d7d66'), rose: makeSprite('#ff4e6a', '#9c1832'), gold: makeSprite('#ffc63a', '#b9711a') };

// ============================================================ pools
function pool(n) { return { x: new Float32Array(n), z: new Float32Array(n), vx: new Float32Array(n), p: new Int32Array(n), g: new Uint32Array(n), big: new Uint8Array(n), n: 0, max: n }; }
const B = pool(1600), Rd = pool(1100);
function add(P, x, z, p, g = 0, big = 0) {
  if (P.n >= P.max) return -1;
  const i = P.n++;
  P.x[i] = Math.max(-0.95, Math.min(0.95, x)); P.z[i] = z; P.vx[i] = (Math.random() - 0.5) * 0.12; P.p[i] = p; P.g[i] = g; P.big[i] = big;
  return i;
}
function compact(P) {
  let j = 0;
  for (let i = 0; i < P.n; i++) if (P.p[i] > 0) {
    if (i !== j) { P.x[j] = P.x[i]; P.z[j] = P.z[i]; P.vx[j] = P.vx[i]; P.p[j] = P.p[i]; P.g[j] = P.g[i]; P.big[j] = P.big[i]; }
    j++;
  }
  P.n = j;
}

// ============================================================ levels
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), 1 | t); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeLevel(n) {
  const r = rng(n * 7919 + 3), gates = [];
  const rows = Math.min(2 + Math.floor(n / 2), 5);
  for (let k = 0; k < rows; k++) {
    const z = 3.2 + k * ((L - 9) / Math.max(1, rows - 1)) + (r() - 0.5) * 0.8;
    const two = r() < 0.55;
    const spots = two ? [-0.48, 0.48] : [(r() - 0.5) * 0.9];
    for (const cx of spots) {
      const roll = r();
      let type = 'mul', k2 = 2;
      if (roll < 0.15 + Math.min(n, 10) * 0.015 && k > 0) type = 'cut';
      else if (roll > 0.82) k2 = n >= 4 && r() < 0.35 ? 4 : 3;
      gates.push({ z, c: cx, x: cx, w: two ? 0.62 : 0.6 + r() * 0.3, type, k: k2, move: n >= 3 && r() < 0.45 ? 0.25 + r() * 0.25 : 0, ph: r() * 6, sp: 0.6 + r() * 0.8, flash: 0 });
    }
  }
  gates.forEach((g, i) => g.bit = 1 << i);
  // How much one shot grows on average across the causeway. Stacked gates multiply, so tower health
  // is sized from the layout instead of the level number alone.
  let sum = 0, samples = 0;
  for (let x = -0.9; x <= 0.9001; x += 0.05) {
    let m = 1;
    for (const g of gates) if (Math.abs(x - g.c) <= g.w / 2) m *= g.type === 'cut' ? 0.5 : g.k;
    sum += m; samples++;
  }
  const growth = sum / samples;
  const clumpEvery = Math.max(0.7, 1.6 - n * 0.05), clumpSize = [2 + Math.floor(n / 4), 4 + Math.floor(n / 3)];
  const enemyRate = (clumpSize[0] + clumpSize[1]) / 2 / clumpEvery;
  // runners a second a player is expected to manage by level n; upgrades max out around level 17, so growth slows after that
  const power = 5 * growth * Math.pow(1.17, Math.min(n - 1, 16)) * (1 + Math.max(0, n - 17) * 0.02);
  return {
    n, gates, growth,
    baseMax: Math.max(90, Math.round((power - enemyRate * 0.6) * 28 / 5) * 5),
    wallMax: 40,
    clumpEvery, clumpSize,
    bruteEvery: n >= 2 ? Math.max(8, 16 - n) : 0, brutePower: 10 + n * 4,
    redSpeed: 2.6 + Math.min(n, 12) * 0.08,
  };
}

// ============================================================ game state
let S = null; // current match
let paused = true;
const brutes = [], parts = [], texts = [];
function startLevel(n) {
  const lv = makeLevel(n);
  B.n = 0; Rd.n = 0; brutes.length = 0; parts.length = 0; texts.length = 0;
  S = { lv, base: lv.baseMax, wall: lv.wallMax, cx: 0, tx: 0, firing: false, fireT: 0, charge: 0, clumpT: 1.2, bruteT: lv.bruteEvery * 0.6,
    t: 0, over: false, shake: 0, baseHit: 0, coinsEarned: 0, kills: 0 };
  $('lvl').textContent = 'Level ' + n;
  $('hud').hidden = $('bottom').hidden = false;
  $('ov').hidden = true;
  paused = false;
  updateHud();
}

// ============================================================ input
let dragging = false;
function aim(clientX) { const s = sc(0.35); S.tx = Math.max(-0.9, Math.min(0.9, (clientX - CX) / (LH * s))); }
cv.addEventListener('pointerdown', e => {
  if (!S || paused) return;
  ensureAudio();
  try { cv.setPointerCapture(e.pointerId); } catch {}
  dragging = true; S.firing = true; aim(e.clientX);
});
cv.addEventListener('pointermove', e => { if (S && !paused && (dragging || e.pointerType === 'mouse')) aim(e.clientX); });
const release = () => { dragging = false; if (S) S.firing = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (!S || paused) return;
  if (e.key === ' ') { S.firing = true; ensureAudio(); e.preventDefault(); }
  if (e.key === 'g' || e.key === 'G' || e.key === 'Enter') launchGiant();
});
addEventListener('keyup', e => { keys[e.key] = false; if (e.key === ' ' && S) S.firing = false; });
$('giant').onclick = () => launchGiant();
$('home').onclick = () => { if (!S || S.over) return; paused = true; S.firing = false; showPause(); };

function launchGiant() {
  if (!S || paused || S.over || S.charge < giantNeed(save.up.giant)) return;
  S.charge = 0;
  add(B, S.cx, 0.7, giantPower(save.up.giant), 0, 1);
  tone(110, 0.35, 'sawtooth', 0.07); tone(220, 0.3, 'triangle', 0.05, 0.05);
  buzz(30);
}

// ============================================================ audio
let ac, lastPop = 0;
function ensureAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch {} }
function tone(f, d, type = 'sine', vol = 0.05, delay = 0) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * 0.6, t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d);
  } catch {}
}
function pop() { const now = performance.now(); if (now - lastPop > 45) { lastPop = now; tone(500 + Math.random() * 400, 0.05, 'triangle', 0.025); } }
function buzz(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch {} }

// ============================================================ effects
function puff(x, z, color, n = 4) {
  if (reduceMotion || parts.length > 380) return;
  for (let i = 0; i < n; i++) parts.push({ x, z, y: 0.05, vx: (Math.random() - 0.5) * 1.2, vz: (Math.random() - 0.5) * 1.2, vy: 1 + Math.random() * 1.5, life: 0.45, max: 0.45, color, r: 0.03 + Math.random() * 0.03 });
}
function floatText(x, z, text, color) { texts.push({ x, z, text, color, t: 0 }); }

// ============================================================ simulation
const CELL = 0.3, GC = Math.ceil(2 / CELL) + 2, GR = Math.ceil(L / CELL) + 2;
const head = new Int32Array(GC * GR), next = new Int32Array(Rd.max);
function step(dt) {
  const lv = S.lv;
  S.t += dt;
  // cannon
  if (keys.ArrowLeft || keys.a) S.tx = Math.max(-0.9, S.tx - dt * 2.2);
  if (keys.ArrowRight || keys.d) S.tx = Math.min(0.9, S.tx + dt * 2.2);
  S.cx += (S.tx - S.cx) * Math.min(1, dt * 14);
  if (S.firing && !S.over) {
    S.fireT -= dt;
    while (S.fireT <= 0) {
      S.fireT += 1 / fireRate(save.up.rate);
      const v = 1 + save.up.volley;
      for (let k = 0; k < v; k++) add(B, S.cx + (k - (v - 1) / 2) * 0.09, 0.65, 1);
      S.charge = Math.min(giantNeed(save.up.giant), S.charge + 1);
      if (Math.random() < 0.5) tone(260, 0.04, 'square', 0.012);
    }
  } else S.fireT = Math.max(0, S.fireT);

  // gates slide
  for (const g of lv.gates) { if (g.move) g.x = Math.max(-1 + g.w / 2, Math.min(1 - g.w / 2, g.c + Math.sin(S.t * g.sp + g.ph) * g.move)); g.flash = Math.max(0, g.flash - dt * 4); }

  // your runners
  const n0 = B.n;
  for (let i = 0; i < n0; i++) {
    if (B.p[i] <= 0) continue;
    const big = B.big[i], z0 = B.z[i];
    const z1 = z0 + (big ? 4.2 : 7.5) * dt;
    B.z[i] = z1;
    B.x[i] += B.vx[i] * dt; if (B.x[i] < -0.93 || B.x[i] > 0.93) { B.vx[i] = -B.vx[i]; B.x[i] = Math.max(-0.93, Math.min(0.93, B.x[i])); }
    if (!big) for (const g of lv.gates) {
      if (z0 < g.z && z1 >= g.z && !(B.g[i] & g.bit) && Math.abs(B.x[i] - g.x) <= g.w / 2) {
        B.g[i] |= g.bit; g.flash = 1;
        if (g.type === 'cut') { if (Math.random() < 0.5) { B.p[i] = 0; puff(B.x[i], g.z, '#ff4e6a', 2); } }
        else for (let c = 1; c < g.k; c++) add(B, B.x[i] + (Math.random() - 0.5) * 0.22, g.z + 0.02 - Math.random() * 0.2, 1, B.g[i]);
      }
    }
    if (B.p[i] > 0 && z1 >= L - 0.7) { // hit the tower
      const dmg = Math.min(B.p[i], S.base);
      S.base -= B.p[i]; S.baseHit = 1; B.p[i] = 0;
      if (Math.random() < 0.25 || big) { puff(B.x[i], L - 0.7, '#ffc63a', big ? 14 : 2); }
      if (big) { S.shake = 0.35; tone(80, 0.4, 'sawtooth', 0.07); buzz(40); }
      S.coinsEarned += dmg * 0.04;
    }
  }

  // their runners
  for (let i = 0; i < Rd.n; i++) {
    if (Rd.p[i] <= 0) continue;
    Rd.z[i] -= lv.redSpeed * dt;
    Rd.x[i] += Rd.vx[i] * dt; if (Rd.x[i] < -0.93 || Rd.x[i] > 0.93) Rd.vx[i] = -Rd.vx[i];
    if (Rd.z[i] <= 0.3) { S.wall -= Rd.p[i]; Rd.p[i] = 0; S.shake = Math.max(S.shake, 0.12); tone(140, 0.12, 'square', 0.03); }
  }
  for (const b of brutes) {
    if (b.p <= 0) continue;
    b.z -= 1.3 * dt; b.bob += dt * 6;
    if (b.z <= 0.4) { S.wall -= b.p; b.p = 0; S.shake = 0.4; tone(70, 0.5, 'sawtooth', 0.08); buzz([40, 30, 40]); }
  }

  // clashes: bucket their runners into a grid, then check each of yours against nearby cells
  head.fill(-1);
  for (let i = 0; i < Rd.n; i++) {
    if (Rd.p[i] <= 0) continue;
    const cx = Math.floor((Rd.x[i] + 1) / CELL) + 1, cz = Math.floor(Rd.z[i] / CELL) + 1;
    if (cz < 0 || cz >= GR) continue;
    const k = cz * GC + cx; next[i] = head[k]; head[k] = i;
  }
  for (let i = 0; i < B.n; i++) {
    if (B.p[i] <= 0) continue;
    const rb = B.big[i] ? 0.2 : R;
    const cx = Math.floor((B.x[i] + 1) / CELL) + 1, cz = Math.floor(B.z[i] / CELL) + 1;
    for (let dz = -1; dz <= 1 && B.p[i] > 0; dz++) {
      const zz = cz + dz; if (zz < 0 || zz >= GR) continue;
      for (let dx = -1; dx <= 1 && B.p[i] > 0; dx++) {
        const xx = cx + dx; if (xx < 0 || xx >= GC) continue;
        for (let j = head[zz * GC + xx]; j !== -1 && B.p[i] > 0; j = next[j]) {
          if (Rd.p[j] <= 0) continue;
          const ddx = B.x[i] - Rd.x[j], ddz = B.z[i] - Rd.z[j], rr = rb + R;
          if (ddx * ddx + ddz * ddz > rr * rr) continue;
          const m = Math.min(B.p[i], Rd.p[j]);
          B.p[i] -= m; Rd.p[j] -= m; S.kills += m;
          puff(Rd.x[j], Rd.z[j], Math.random() < 0.5 ? '#ffffff' : '#ff9aa9', 3); pop();
        }
      }
    }
    for (const b of brutes) {
      if (b.p <= 0 || B.p[i] <= 0) continue;
      const ddx = B.x[i] - b.x, ddz = B.z[i] - b.z, rr = rb + 0.28;
      if (ddx * ddx + ddz * ddz > rr * rr) continue;
      const m = Math.min(B.p[i], b.p);
      B.p[i] -= m; b.p -= m; b.hit = 1; pop();
      if (b.p <= 0) { puff(b.x, b.z, '#ff4e6a', 20); tone(90, 0.4, 'sawtooth', 0.06); S.coinsEarned += 4; floatText(b.x, b.z, '+4', '#ffc63a'); }
    }
  }
  for (const b of brutes) b.hit = Math.max(0, (b.hit || 0) - dt * 6);
  for (let i = brutes.length - 1; i >= 0; i--) if (brutes[i].p <= 0) brutes.splice(i, 1);
  compact(B); compact(Rd);

  // enemy waves
  if (!S.over) {
    S.clumpT -= dt;
    if (S.clumpT <= 0) {
      S.clumpT = lv.clumpEvery * (0.7 + Math.random() * 0.6);
      const [a, b] = lv.clumpSize, k = a + Math.floor(Math.random() * (b - a + 1)), x0 = (Math.random() - 0.5) * 1.2;
      for (let i = 0; i < k; i++) add(Rd, x0 + (Math.random() - 0.5) * 0.35, L - 0.9 - Math.random() * 0.5, 1);
    }
    if (lv.bruteEvery) {
      S.bruteT -= dt;
      if (S.bruteT <= 0) { S.bruteT = lv.bruteEvery; brutes.push({ x: (Math.random() - 0.5) * 1.1, z: L - 1, p: lv.brutePower, max: lv.brutePower, bob: 0 }); tone(60, 0.6, 'sawtooth', 0.05); }
    }
  }

  // effects
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt; p.vy -= 6 * dt;
  }
  for (let i = texts.length - 1; i >= 0; i--) { texts[i].t += dt; if (texts[i].t > 1) texts.splice(i, 1); }
  S.shake = Math.max(0, S.shake - dt); S.baseHit = Math.max(0, S.baseHit - dt * 5);

  // end of match
  if (!S.over && S.base <= 0) { S.base = 0; S.over = 'win'; S.firing = false; towerFalls(); setTimeout(showWin, 1400); }
  else if (!S.over && S.wall <= 0) { S.wall = 0; S.over = 'lose'; S.firing = false; tone(100, 0.8, 'sawtooth', 0.07); setTimeout(showLose, 1000); }
  if (S.over === 'win') { for (let i = 0; i < Rd.n; i++) Rd.p[i] = Math.random() < dt * 3 ? (puff(Rd.x[i], Rd.z[i], '#ffffff', 3), 0) : Rd.p[i]; }
}
function towerFalls() {
  S.shake = 0.8; buzz([60, 40, 60, 40, 120]);
  [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.06, 0.1 + i * 0.1));
  tone(60, 1, 'sawtooth', 0.08);
  for (let i = 0; i < 70; i++) parts.push({ x: (Math.random() - 0.5) * 1.4, z: L - 0.6 + Math.random() * 0.6, y: Math.random() * 1.2, vx: (Math.random() - 0.5) * 3, vz: -Math.random() * 3, vy: 2 + Math.random() * 4, life: 1.2, max: 1.2, color: Math.random() < 0.5 ? '#ffc63a' : '#ff4e6a', r: 0.05 + Math.random() * 0.06 });
}

// ============================================================ drawing
function quad(a, b, c, d, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill(); }
const P = (x, z, y = 0) => [PX(x, z), PY(z) - y * PS(z)];
let ZS = new Float32Array(4096);

function drawScene() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let sx = 0, sy = 0;
  if (S && S.shake > 0 && !reduceMotion) { sx = (Math.random() - 0.5) * 14 * S.shake; sy = (Math.random() - 0.5) * 14 * S.shake; }
  ctx.translate(sx, sy);
  // sky + canyon
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#2a1c55'); sky.addColorStop(0.35, '#6b3f86'); sky.addColorStop(0.62, '#f39a6b'); sky.addColorStop(1, '#c4673f');
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);
  const fy = PY(L);
  ctx.fillStyle = 'rgba(255,214,150,.9)'; ctx.beginPath(); ctx.arc(W * 0.78, fy - H * 0.05, Math.min(W, H) * 0.07, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a2b5e';
  ctx.beginPath(); ctx.moveTo(-20, fy + 10);
  for (let i = 0; i <= 12; i++) ctx.lineTo(i / 12 * (W + 40) - 20, fy - 10 - ((i * 37) % 23) - (i % 3) * 8);
  ctx.lineTo(W + 20, H + 20); ctx.lineTo(-20, H + 20); ctx.fill();
  const ground = ctx.createLinearGradient(0, fy, 0, H);
  ground.addColorStop(0, '#7a3f5c'); ground.addColorStop(1, '#d9784a');
  ctx.fillStyle = ground; ctx.fillRect(-20, fy, W + 40, H);
  // causeway deck
  quad(P(-1.12, -1), P(1.12, -1), P(1.12, L + 0.6), P(-1.12, L + 0.6), '#9b6b55');
  quad(P(-1, -1), P(1, -1), P(1, L + 0.6), P(-1, L + 0.6), '#d8cab6');
  for (let z = 0; z < L; z += 1.6) quad(P(-0.03, z), P(0.03, z), P(0.03, z + 0.8), P(-0.03, z + 0.8), 'rgba(255,255,255,.55)');
  for (let z = -1; z < L; z += 1) { quad(P(-1, z), P(1, z), P(1, z + 0.04), P(-1, z + 0.04), 'rgba(120,90,70,.12)'); }
  // rails
  for (const side of [-1, 1]) {
    ctx.strokeStyle = '#5b3a4a'; ctx.lineWidth = 2;
    ctx.beginPath(); const a = P(side * 1.06, -1, 0.25), b = P(side * 1.06, L + 0.6, 0.25); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    for (let z = -1; z < L + 0.6; z += 0.8) { const p0 = P(side * 1.06, z), p1 = P(side * 1.06, z, 0.25); ctx.lineWidth = Math.max(1, PS(z) * 0.03); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke(); }
  }
  if (!S) return;
  drawTower();

  // depth-sorted things: runners, brutes, gates (far to near)
  // the first B.n entries are your runners, the rest are theirs
  const total = B.n + Rd.n;
  if (ZS.length < total) { ZS = new Float32Array(total * 2); }
  const order = new Array(total);
  for (let i = 0; i < B.n; i++) { ZS[i] = B.z[i]; order[i] = i; }
  for (let i = 0; i < Rd.n; i++) { ZS[B.n + i] = Rd.z[i]; order[B.n + i] = B.n + i; }
  order.sort((a, b) => ZS[b] - ZS[a]);
  const gates = S.lv.gates.slice().sort((a, b) => b.z - a.z), br = brutes.slice().sort((a, b) => b.z - a.z);
  let gi = 0, bi = 0;
  const flushTo = z => {
    while (gi < gates.length && gates[gi].z >= z) drawGate(gates[gi++]);
    while (bi < br.length && br[bi].z >= z) drawBrute(br[bi++]);
  };
  for (const k of order) {
    const mine = k < B.n, team = mine ? 'b' : 'r', i = mine ? k : k - B.n;
    const Pp = mine ? B : Rd, z = Pp.z[i];
    flushTo(z);
    const big = Pp.big[i], s = PS(z) * (big ? 0.5 : R * 2.6), x = PX(Pp.x[i], z), y = PY(z);
    ctx.drawImage(team === 'b' ? (big ? SPR.gold : SPR.mint) : SPR.rose, x - s / 2, y - s * 0.86, s, s);
    if (big) label(String(Pp.p[i]), x, y - s * 0.95, Math.max(12, s * 0.32), '#ffc63a');
  }
  flushTo(-99);
  drawCannon();
  for (const p of parts) { const s = Math.max(1, p.r * PS(p.z)); ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(PX(p.x, p.z), PY(p.z) - p.y * PS(p.z) * 0.6, s, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const t of texts) { ctx.globalAlpha = 1 - t.t; label(t.text, PX(t.x, t.z), PY(t.z) - 30 - t.t * 30, 20, t.color); }
  ctx.globalAlpha = 1;
}

function label(text, x, y, size, color) {
  ctx.font = `800 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size * 0.18); ctx.strokeStyle = 'rgba(27,20,48,.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function drawGate(g) {
  const x0 = g.x - g.w / 2, x1 = g.x + g.w / 2, h = 0.55, z = g.z, cut = g.type === 'cut';
  const col = cut ? 'rgba(255,78,106,' : 'rgba(127,231,255,';
  // posts
  for (const xx of [x0, x1]) quad(P(xx - 0.025, z), P(xx + 0.025, z), P(xx + 0.025, z, h + 0.05), P(xx - 0.025, z, h + 0.05), cut ? '#8e1f37' : '#2b6f8a');
  quad(P(x0, z, 0.02), P(x1, z, 0.02), P(x1, z, h), P(x0, z, h), col + (0.38 + g.flash * 0.35) + ')');
  quad(P(x0, z, h - 0.06), P(x1, z, h - 0.06), P(x1, z, h), P(x0, z, h), cut ? '#ff4e6a' : '#7fe7ff');
  const c = P(g.x, z, h * 0.5), s = PS(z);
  label(cut ? '÷2' : '×' + g.k, c[0], c[1], Math.max(12, s * 0.26 * (1 + g.flash * 0.15)), cut ? '#ffd1d9' : '#ffffff');
}

function drawBrute(b) {
  const s = PS(b.z) * 0.62, x = PX(b.x, b.z), y = PY(b.z) - Math.abs(Math.sin(b.bob)) * PS(b.z) * 0.04;
  ctx.save();
  if (b.hit) { ctx.globalAlpha = 0.75 + 0.25 * Math.sin(b.hit * 20); }
  ctx.drawImage(SPR.rose, x - s / 2, y - s * 0.86, s, s);
  ctx.restore();
  // horns + hp bar
  ctx.fillStyle = '#3b1530';
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + d * s * 0.2, y - s * 0.78); ctx.lineTo(x + d * s * 0.34, y - s * 1.02); ctx.lineTo(x + d * s * 0.3, y - s * 0.72); ctx.fill(); }
  const bw = s * 0.9, by = y - s * 1.08;
  ctx.fillStyle = 'rgba(27,20,48,.8)'; ctx.fillRect(x - bw / 2, by - 4, bw, 8);
  ctx.fillStyle = '#ff4e6a'; ctx.fillRect(x - bw / 2 + 1, by - 3, (bw - 2) * b.p / b.max, 6);
  label(String(b.p), x, by - 12, Math.max(12, s * 0.2), '#ffffff');
}

function drawTower() {
  const z = L - 0.6, d = 1.1, w = 0.75, h = 1.35 - (1 - S.base / S.lv.baseMax) * 0.45;
  const jig = S.baseHit && !reduceMotion ? (Math.random() - 0.5) * 0.02 : 0;
  // side + top + front faces
  quad(P(-w + jig, z), P(-w + jig, z + d), P(-w + jig, z + d, h), P(-w + jig, z, h), '#7a2240');
  quad(P(w + jig, z), P(w + jig, z + d), P(w + jig, z + d, h), P(w + jig, z, h), '#7a2240');
  quad(P(-w + jig, z, h), P(w + jig, z, h), P(w + jig, z + d, h), P(-w + jig, z + d, h), '#e0566f');
  quad(P(-w + jig, z), P(w + jig, z), P(w + jig, z, h), P(-w + jig, z, h), S.baseHit > 0.5 ? '#ff8da0' : '#c9354f');
  // crenellations
  for (let k = 0; k < 5; k++) { const x0 = -w + k * (2 * w / 5) + 0.04, x1 = x0 + 2 * w / 5 - 0.12; if (k % 2) continue; quad(P(x0, z, h), P(x1, z, h), P(x1, z, h + 0.18), P(x0, z, h + 0.18), '#e0566f'); }
  // door
  quad(P(-0.22, z - 0.001), P(0.22, z - 0.001), P(0.22, z - 0.001, 0.5), P(-0.22, z - 0.001, 0.5), '#3b1530');
  const c = P(0, z, h * 0.65);
  label(String(Math.max(0, Math.ceil(S.base))), c[0], c[1], Math.max(18, PS(z) * 0.42), '#ffffff');
}

function drawCannon() {
  const z = 0.35, x = PX(S.cx, z), y = PY(z), s = PS(z);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + s * 0.02, s * 0.2, s * 0.06, 0, 0, 7); ctx.fill();
  // wheels
  ctx.fillStyle = '#3b2a5c';
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(x + d * s * 0.15, y - s * 0.04, s * 0.06, 0, 7); ctx.fill(); }
  // body
  const g = ctx.createLinearGradient(x - s * 0.15, 0, x + s * 0.15, 0);
  g.addColorStop(0, '#139a7e'); g.addColorStop(0.5, '#4ff0c9'); g.addColorStop(1, '#139a7e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - s * 0.15, y - s * 0.2, s * 0.3, s * 0.18, s * 0.06) : ctx.rect(x - s * 0.15, y - s * 0.2, s * 0.3, s * 0.18); ctx.fill();
  // barrel pointing up the causeway
  const recoil = S.firing ? Math.sin(S.t * 60) * s * 0.008 : 0;
  ctx.fillStyle = '#0d7d66';
  ctx.beginPath(); ctx.moveTo(x - s * 0.07, y - s * 0.17 + recoil); ctx.lineTo(x + s * 0.07, y - s * 0.17 + recoil); ctx.lineTo(x + s * 0.05, y - s * 0.38 + recoil); ctx.lineTo(x - s * 0.05, y - s * 0.38 + recoil); ctx.fill();
  ctx.fillStyle = '#4ff0c9'; ctx.fillRect(x - s * 0.06, y - s * 0.4 + recoil, s * 0.12, s * 0.04);
}

// ============================================================ HUD + screens
function updateHud() {
  if (!S) return;
  const b = Math.max(0, S.base) / S.lv.baseMax, w = Math.max(0, S.wall) / S.lv.wallMax;
  $('baseBar').style.width = `calc(${b * 100}% - 6px)`;
  $('baseTxt').textContent = `Tower ${Math.max(0, Math.ceil(S.base))}`;
  $('wallBar').style.width = `calc(${w * 100}% - 6px)`;
  $('wallTxt').textContent = Math.max(0, Math.ceil(S.wall));
  $('coins').textContent = '● ' + (save.coins + Math.floor(S.coinsEarned));
  const need = giantNeed(save.up.giant), pct = S.charge / need * 100;
  $('giant').style.setProperty('--pct', pct + '%');
  $('giant').classList.toggle('ready', S.charge >= need);
  $('giant').firstElementChild.innerHTML = S.charge >= need ? 'GIANT<br>GO!' : `GIANT<br>${Math.floor(pct)}%`;
}

function card(html, bind) { $('card').innerHTML = html; $('ov').hidden = false; bind && bind($('card')); const f = $('card').querySelector('.go'); f && f.focus(); }
function upgradesHtml() {
  return `<div class="ups">${UPGRADES.map(u => {
    const l = save.up[u.k], maxed = l >= u.max, cost = upCost(u.k, l);
    return `<div class="up"><b>${u.name} <span style="opacity:.6;font-size:.85rem">Lv ${l + 1}</span></b><small>${u.desc(l)}${maxed ? '' : ` → ${u.next(l + 1)}`}</small>
      <button data-up="${u.k}" ${maxed || save.coins < cost ? 'disabled' : ''}>${maxed ? 'Max' : '● ' + cost}</button></div>`;
  }).join('')}</div>`;
}
function bindUpgrades(c, again) {
  c.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const k = b.dataset.up, cost = upCost(k, save.up[k]);
    if (save.coins < cost) return;
    save.coins -= cost; save.up[k]++; persist(); tone(880, 0.12, 'triangle', 0.05); again();
  });
}
function showMenu() {
  paused = true; $('hud').hidden = $('bottom').hidden = true; S = null;
  card(`<h1>Gate<br>crash</h1>
    <p>Hold and drag to aim. Your runners pour through the gates, multiply, clash with the enemy crowd and storm the tower.</p>
    <button class="go" id="play">Play level ${save.level}</button>
    <p class="gold">● ${save.coins} coins</p>
    ${upgradesHtml()}
    <p class="howto">Blue gates multiply runners that pass through. Red ÷2 gates knock out half. Fill the gold ring, then tap it to launch a giant. Keyboard: arrows to aim, space to fire, G for a giant.</p>`, c => {
    c.querySelector('#play').onclick = () => { ensureAudio(); startLevel(save.level); };
    bindUpgrades(c, showMenu);
  });
}
function showPause() {
  card(`<h2>Paused</h2><button class="go" id="res">Resume</button><button class="sec" id="rst">Restart level</button><button class="sec" id="men">Menu</button>`, c => {
    c.querySelector('#res').onclick = () => { $('ov').hidden = true; paused = false; };
    c.querySelector('#rst').onclick = () => startLevel(S.lv.n);
    c.querySelector('#men').onclick = showMenu;
  });
}
function showWin() {
  const n = S.lv.n, hp = S.wall / S.lv.wallMax, stars = hp >= 0.9 ? 3 : hp >= 0.5 ? 2 : 1;
  const earned = Math.floor(S.coinsEarned) + 15 + n * 6 + stars * 8;
  save.coins += earned; save.level = Math.max(save.level, n + 1);
  save.best[n] = Math.max(save.best[n] || 0, stars); persist();
  const done = () => card(`<div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
    <h2>Tower down!</h2><p>Level ${n} cleared in ${Math.round(S.t)}s · ${S.kills} enemies stopped</p>
    <p class="gold" style="font-size:1.3rem">+● ${earned} coins</p>
    ${upgradesHtml()}
    <button class="go" id="next">Level ${n + 1}</button><button class="sec" id="men">Menu</button>`, c => {
    c.querySelector('#next').onclick = () => startLevel(n + 1);
    c.querySelector('#men').onclick = showMenu;
    bindUpgrades(c, done);
  });
  done();
  updateHud();
}
function showLose() {
  const n = S.lv.n, left = Math.ceil(S.base), pct = Math.round((1 - left / S.lv.baseMax) * 100);
  const earned = Math.floor(S.coinsEarned) + 5;
  save.coins += earned; persist();
  const done = () => card(`<h2>Gatehouse overrun</h2><p>The tower was ${pct}% down with ${left} left to go.</p>
    <p class="gold">+● ${earned} coins</p>
    ${upgradesHtml()}
    <button class="go" id="again">Try again</button><button class="sec" id="men">Menu</button>`, c => {
    c.querySelector('#again').onclick = () => startLevel(n);
    c.querySelector('#men').onclick = showMenu;
    bindUpgrades(c, done);
  });
  done();
}

// ============================================================ loop
let last = performance.now(), hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  if (S && !paused) { step(dt); hudT += dt; if (hudT > 0.1) { hudT = 0; updateHud(); } }
  drawScene();
}
showMenu();
requestAnimationFrame(frame);
window.__gc = { get S() { return S; }, B, Rd, startLevel, save, step, launchGiant, upCost, giantNeed, UPGRADES, makeLevel, unpause: () => { paused = false; } }; // used by the automated play test
})();
</script>
</body>
</html>
