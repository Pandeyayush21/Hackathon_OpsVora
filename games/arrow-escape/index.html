<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrow Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f2933">
<link rel="manifest" href="manifest.webmanifest" data-pwa>
<link rel="icon" href="icon.svg" type="image/svg+xml" data-pwa>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app with three views (menu, level map, board). The board view is a slim top bar,
   a HUD row, a zoomable canvas in the middle and one line of help underneath. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel-2:#e3e8f0; --fg:#1d2533; --muted:#647086;
  --line:#7d8aa3; --line-hi:#3d4a63; --dot:#c4cbd8;
  --accent:#b8740a; --on-accent:#ffffff; --danger:#d63c33; --hint:#14907f; --life:#4a6cf2;
  --stone:#9aa3b2; --tile:#5d6b85; --lock:#b7860b;
  --g0:#d9466f; --g1:#2f7fe0; --g2:#2a9d57; --p0:#8a4fd8; --p1:#d9467d; --p2:#1d8fae;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f2933; --panel:#28343f; --panel-2:#323f4c; --fg:#e7ecf3; --muted:#8d99ab;
  --line:#9aa8c0; --line-hi:#e4eaf4; --dot:#3c4a58;
  --accent:#f6b23c; --on-accent:#10151c; --danger:#ff6a5f; --hint:#3fd0bd; --life:#5b7cff;
  --stone:#5a6776; --tile:#b4c0d4; --lock:#f2c94c;
  --g0:#ff6f96; --g1:#5fa3ff; --g2:#4fd486; --p0:#b58cff; --p1:#ff7aa8; --p2:#4cc8ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f2933; --panel:#28343f; --panel-2:#323f4c; --fg:#e7ecf3; --muted:#8d99ab;
  --line:#9aa8c0; --line-hi:#e4eaf4; --dot:#3c4a58;
  --accent:#f6b23c; --on-accent:#10151c; --danger:#ff6a5f; --hint:#3fd0bd; --life:#5b7cff;
  --stone:#5a6776; --tile:#b4c0d4; --lock:#f2c94c;
  --g0:#ff6f96; --g1:#5fa3ff; --g2:#4fd486; --p0:#b58cff; --p1:#ff7aa8; --p2:#4cc8ea; color-scheme:dark}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  -webkit-user-select:none;user-select:none;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:680px;margin:0 auto}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid color-mix(in srgb,var(--line) 35%,transparent);
  border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:var(--line)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.primary{background:var(--accent);color:var(--on-accent);border:0;font-weight:700}
.primary:hover{filter:brightness(1.06)}

/* ---- menu ---- */
.menu{overflow-y:auto;overflow-x:hidden;gap:18px;padding-block:8px 24px}
.brand{display:flex;align-items:center;gap:14px;margin-top:8px}
.brand svg{width:56px;height:56px;flex:none}
.brand h1{margin:0;font-size:2.3rem;font-weight:800;letter-spacing:-.01em;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted)}
.cta{height:auto;padding:16px 18px;justify-content:space-between;border-radius:14px;font-size:1.15rem;text-align:left}
.cta small{display:block;font-family:var(--mono);font-size:.72rem;font-weight:500;opacity:.8;letter-spacing:.04em;margin-top:2px}
.cta .stars-total{font-family:var(--mono);font-size:.9rem}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{height:auto;flex-direction:column;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;gap:4px;min-width:0}
.mode b{font-size:1.05rem}
.mode span{color:var(--muted);font-size:.85rem;line-height:1.3}
.mode em{font-style:normal;font-family:var(--mono);font-size:.72rem;color:var(--accent);margin-top:4px;letter-spacing:.02em}
.mode .ic{width:26px;height:26px;stroke:var(--accent)}
.menu-foot{display:flex;gap:10px}
.menu-foot button{flex:1}

/* ---- level map ---- */
.bar{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.bar h2{margin:0;font-size:1.4rem;flex:1}
.bar .count{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.worlds{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.world{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.world.locked{opacity:.5}
.world h3{margin:0;font-size:1.1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.world h3 small{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.world p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.35}
.lv-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lv{height:52px;flex-direction:column;gap:0;padding:0;font-variant-numeric:tabular-nums;font-weight:700;background:var(--panel-2);border-color:transparent}
.lv .st{font-size:.62rem;letter-spacing:1px;color:var(--accent);height:12px;line-height:12px}
.lv.boss{border:1.5px solid var(--accent)}
.lv.current{outline:2px solid var(--accent);outline-offset:1px}

/* ---- board view ---- */
.gbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gbar .left,.gbar .right{display:flex;gap:6px;align-items:center}
.gbar .right{justify-content:flex-end}
.gbar .right button{min-width:36px;padding:0 8px}
.lvl{font-size:1.35rem;font-weight:700;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0}
.lvl small{display:block;font-family:var(--mono);font-size:.64rem;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
#undo span{font-family:var(--mono);font-size:.7rem}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px;min-height:26px}
.pips{display:flex;gap:7px}
.pip{width:17px;height:21px}
.pip path{fill:var(--life);transition:fill .3s}
.pip.lost path{fill:var(--dot)}
.hud-mid,.hud-right{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-mid{text-align:center;color:var(--fg)}
.hud-right{text-align:right}
.meter{display:inline-block;width:84px;height:8px;border-radius:4px;background:var(--panel-2);vertical-align:middle;overflow:hidden;margin-left:6px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meter.hot i{background:var(--danger)}
#stage{flex:1;min-height:0;position:relative;margin-block:8px;overflow:hidden;border-radius:14px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;outline:none;-webkit-touch-callout:none}
#coach{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(92%,440px);background:var(--panel);
  border:1px solid color-mix(in srgb,var(--hint) 55%,transparent);border-radius:12px;padding:10px 14px;font-size:.95rem;line-height:1.4;
  text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.12);pointer-events:none;text-wrap:balance}
#coach b{color:var(--hint)}
#mini{position:absolute;left:8px;bottom:8px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);touch-action:none;cursor:pointer}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{height:36px;min-width:36px;padding:0;background:color-mix(in srgb,var(--panel) 92%,transparent)}
#duelBar{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--panel);
  border-radius:12px;padding:6px 6px 6px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12);white-space:nowrap}
#duelText b{color:var(--pc,var(--accent))}
footer{text-align:center;color:var(--muted);font-size:.86rem;line-height:1.4;min-height:1.2em}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border-radius:18px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;
  box-shadow:0 12px 40px rgba(0,0,0,.2);width:min(100%,360px);max-height:100%;overflow-y:auto}
.card h2{margin:0;font-size:1.6rem;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45;text-wrap:pretty}
.card .mono{font-family:var(--mono);font-size:.8rem}
.card .row{display:flex;gap:8px;width:100%}
.card .row button{flex:1}
.card .big{height:46px;width:100%;font-size:1.05rem}
.stars{display:flex;gap:6px}
.piece-ic{width:64px;height:64px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.badge{font-family:var(--mono);font-size:.72rem;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 10px;letter-spacing:.04em}
.settings{text-align:left;align-items:stretch}
.settings h2{text-align:center}
.toggle{display:flex;justify-content:space-between;align-items:center;width:100%;height:46px;padding:0 14px}
.toggle i{width:40px;height:24px;border-radius:12px;background:var(--panel-2);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle[aria-pressed="true"] i{background:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(16px);background:var(--on-accent)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.skin{height:auto;flex-direction:column;padding:10px 6px;gap:6px;font-size:.85rem}
.skin canvas{width:72px;height:28px}
.skin small{font-family:var(--mono);font-size:.66rem;color:var(--muted)}
.skin[aria-pressed="true"]{border:2px solid var(--accent)}
.danger-btn{color:var(--danger)}
h3.sub{margin:6px 0 0;font-size:.8rem;font-family:var(--mono);font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:380px){.brand h1{font-size:1.9rem}.lvl{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){.pip path,.toggle i,.toggle i::after,.meter i{transition:none}}
</style>
</head>
<body data-world="0">

<!-- ================= MENU ================= -->
<section id="menu" class="screen menu">
  <div class="brand">
    <svg viewBox="0 0 56 56" aria-hidden="true"><path d="M10 46V22h18V10" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 3l8 10H20z" fill="var(--line)"/><path d="M22 34h20" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><path d="M50 34l-10 8V26z" fill="var(--accent)"/></svg>
    <div><h1>Arrow Escape</h1><p>Slide every arrow off the board.</p></div>
  </div>
  <button class="cta primary" id="continue"><span>Continue<small id="contLabel">Level 1</small></span><span class="stars-total" id="starsTotal">★ 0</span></button>
  <div class="modes" id="modes"></div>
  <div class="menu-foot"><button id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings and arrow styles</button></div>
</section>

<!-- ================= LEVEL MAP ================= -->
<section id="levels" class="screen" hidden>
  <div class="bar">
    <button id="levelsBack" aria-label="Back to menu"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2>Levels</h2><span class="count" id="levelsStars"></span>
  </div>
  <div class="worlds" id="worldList"></div>
</section>

<!-- ================= BOARD ================= -->
<section id="game" class="screen" hidden>
  <header class="gbar">
    <div class="left">
      <button id="home" aria-label="Back to menu"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg></button>
    </div>
    <div class="lvl" id="gTitle">Level 1<small id="gSub">How to play</small></div>
    <div class="right">
      <button id="undo" aria-label="Undo last move"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span id="undoN"></span></button>
      <button id="hint" aria-label="Show a free arrow"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
      <button id="restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button>
    </div>
  </header>
  <div class="hud">
    <div class="pips" id="pips"></div>
    <div class="hud-mid" id="hudMid"></div>
    <div class="hud-right" id="hudRight"></div>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="Puzzle board"></canvas>
    <div id="coach" hidden></div>
    <div id="duelBar" hidden><span id="duelText"></span><button id="endTurn">End turn</button></div>
    <canvas id="mini" hidden aria-label="Board overview"></canvas>
    <div class="zoom" id="zoom">
      <button id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zfit" aria-label="Fit board to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <footer id="foot"></footer>
</section>

<div class="overlay" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<script src="engine.js"></script>
<script>
(() => {
'use strict';
const E = window.ArrowEngine, { DIRS, T, WORLDS } = E;
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ======================================================= save data
const SAVE_KEY = 'arrow-escape-v2';
const DEFAULTS = { unlocked: 1, lv: {}, perfect: 0, daily: {}, zen: 0, time: 0, surge: 0, duel: [0, 0], seen: {},
  set: { sound: true, vibe: true, fx: true, cb: false, skin: 0 } };
let save = JSON.parse(JSON.stringify(DEFAULTS));
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s, { set: Object.assign(save.set, s.set || {}) }); } catch {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} }
const totalStars = () => Object.values(save.lv).reduce((s, v) => s + (v.stars || 0), 0);
const SKINS = [{ name: 'Classic', need: 0 }, { name: 'Neon', need: 10 }, { name: 'Ribbon', need: 25 }, { name: 'Pixel', need: 50 }, { name: 'Dotted', need: 90 }];
const skinUnlocked = i => totalStars() >= SKINS[i].need;

// ======================================================= world colours
const ACCENTS = [['#b8740a','#f6b23c'],['#b4532a','#ff8f5a'],['#7b4fd0','#b192ff'],['#1f7fa3','#4cc3ea'],['#2f8a3a','#6fd36f'],
  ['#ad3a88','#f27acb'],['#3557d1','#86a2ff'],['#c23d20','#ff7a5c'],['#677512','#c3d34f'],['#9c5e26','#e8a55a']];
{
  let css = '';
  ACCENTS.forEach(([l, d], i) => {
    css += `body[data-world="${i}"]{--accent:${l}}`;
    css += `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-world="${i}"]{--accent:${d}}}`;
    css += `:root[data-theme="dark"] body[data-world="${i}"]{--accent:${d}}`;
  });
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
}
let C = {};
function readTokens() {
  const cs = getComputedStyle(document.body), t = n => cs.getPropertyValue(n).trim();
  C = { bg: t('--bg'), panel: t('--panel'), panel2: t('--panel-2'), fg: t('--fg'), muted: t('--muted'), line: t('--line'), hi: t('--line-hi'),
    dot: t('--dot'), acc: t('--accent'), bad: t('--danger'), hint: t('--hint'), stone: t('--stone'), tile: t('--tile'), lock: t('--lock'),
    g: [t('--g0'), t('--g1'), t('--g2')], p: [t('--p0'), t('--p1'), t('--p2')], mono: t('--mono'), display: t('--display') };
}
function setWorld(w) { document.body.dataset.world = w; readTokens(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });

// ======================================================= sound + haptics
let ac;
function ensureAudio() { if (!save.set.sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch {} }
function tone(f, d, type = 'sine', vol = 0.06, delay = 0) {
  if (!ac || !save.set.sound) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d);
  } catch {}
}
function buzz(p) { if (save.set.vibe && navigator.vibrate) try { navigator.vibrate(p); } catch {} }

// ======================================================= screens
function show(id) {
  for (const s of ['menu', 'levels', 'game']) $(s).hidden = s !== id;
  if (id === 'menu') { setWorld(0); renderMenu(); }
  if (id === 'levels') { setWorld(0); renderLevels(); }
}
const fmt = sec => { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const starRow = (n, size = 30) => {
  const star = on => `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="${on ? 'var(--accent)' : 'var(--dot)'}"/></svg>`;
  return `<div class="stars">${star(n >= 1)}${star(n >= 2)}${star(n >= 3)}</div>`;
};
const worldOf = n => n === 1 ? 0 : Math.min(Math.floor((n - 1) / 10), 9);

const MODE_ICONS = {
  levels: '<path d="M4 20V10l4-3 4 3 4-6 4 4v12z"/>',
  daily: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  zen: '<path d="M12 21c-5 0-8-3-8-7 3 0 6 1 8 4 2-3 5-4 8-4 0 4-3 7-8 7zM12 18c-2-3-2-8 0-13 2 5 2 10 0 13z"/>',
  time: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  surge: '<path d="M3 17l5-5 4 4 8-9M14 7h6v6"/>',

    ctx.strokeStyle = C.muted; ctx.lineWidth = Math.max(1.5, s * 0.06); ctx.setLineDash([s * 0.16, s * 0.12]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(ma[0]), Y(ma[1])); ctx.lineTo(X(mb[0]), Y(mb[1])); ctx.stroke(); ctx.setLineDash([]);
    for (const m of [ma, mb]) { ctx.fillStyle = C.panel; ctx.strokeStyle = C.muted; ctx.lineWidth = Math.max(1.5, s * 0.05); ctx.beginPath(); ctx.arc(X(m[0]), Y(m[1]), s * 0.13, 0, 7); ctx.fill(); ctx.stroke(); }
  }

  const speed = reduceMotion ? 60 : 24;
  const target = tutorial() && !G.over && E.TUTORIAL_STEPS[G.step] ? E.TUTORIAL_STEPS[G.step].target : -1;
  const font = C.mono;
  for (const a of B.arrows) {
    const an = G.anims.get(a.id);
    if (B.gone[a.id] && !an) continue;
    let pts = a.cells, t = 0, alpha = a.born ? Math.min(1, (now - a.born) / 350) : 1, shakeX = 0, moving = false;
    const base = a.color >= 0 ? C.g[a.color] : C.line;
    let col = base;
    const n = a.cells.length - 1;
    if (an) {
      const tau = (now - an.t0) / 1000;
      if (an.type === 'exit') {
        pts = an.ext; t = speed * tau + 30 * tau * tau; col = an.color; moving = true;
        alpha = Math.max(0, 1 - Math.max(0, t - an.edgeAt) / (n + 1));
        if (t >= an.total) { G.anims.delete(a.id); continue; }
        if (save.set.fx && !reduceMotion && Math.random() < 0.7) {
          const h = at(pts, t + n);
          G.particles.push({ x: h[0], y: h[1], vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, life: 0.35, max: 0.35, color: col, size: 0.07, g: 0 });
        }
      } else if (an.type === 'bump') {
        pts = an.ext; moving = true;
        const out = speed * tau * 0.8;
        t = out < an.target ? out : 2 * an.target - out; col = C.bad;
        if (t <= 0) { t = 0; G.anims.delete(a.id); pts = a.cells; moving = false; }
      } else {
        const p = tau / 0.4;
        if (p >= 1) G.anims.delete(a.id); else shakeX = Math.sin(p * Math.PI * 7) * (1 - p) * s * 0.14;
        col = C.bad;
      }
    } else if (G.flash[a.id] && now - G.flash[a.id] < 450) col = C.bad;
    else if ((a.id === G.hintId && now < G.hintUntil) || a.id === target) col = C.hint;
    else if (a.id === G.hover) col = a.color >= 0 ? base : C.hi;

    ctx.save();
    ctx.translate(shakeX, 0);
    ctx.globalAlpha = alpha;
    strokeStyle(ctx, skin, col, s);
    ctx.beginPath();
    const p0 = at(pts, t); ctx.moveTo(X(p0[0]), Y(p0[1]));
    for (let i = Math.floor(t) + 1; i < t + n; i++) { const q = pts[i]; if (q[2]) ctx.moveTo(X(q[0]), Y(q[1])); else ctx.lineTo(X(q[0]), Y(q[1])); }
    const h = at(pts, t + n), k = Math.floor(t + n);
    if (pts[k + 1] && pts[k + 1][2]) ctx.moveTo(X(h[0]), Y(h[1])); else ctx.lineTo(X(h[0]), Y(h[1]));
    ctx.stroke();
    if (skin === 2) { // ribbon: lighter core
      ctx.save(); ctx.strokeStyle = C.panel; ctx.globalAlpha = alpha * 0.55; ctx.lineWidth = Math.max(1, s * 0.06); ctx.stroke(); ctx.restore();
    }
    const [hdx, hdy] = moving ? headDir(pts, t + n) : DIRS[a.dir];
    drawHead(ctx, X(h[0]), Y(h[1]), hdx, hdy, s * 0.34, skin, col);
    if (!moving && a.dir2 >= 0) { const tc = a.cells[0]; drawHead(ctx, X(tc[0]), Y(tc[1]), DIRS[a.dir2][0], DIRS[a.dir2][1], s * 0.34, skin, col); }
    ctx.shadowBlur = 0;

    // badges
    const tail = at(pts, t), tx = X(tail[0]), ty = Y(tail[1]);
    if (cb && a.color >= 0) { const m = at(pts, t + n / 2); ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(X(m[0]), Y(m[1]), s * 0.2, 0, 7); ctx.fill(); symbol(ctx, a.color, X(m[0]), Y(m[1]), s * 0.13, base); }
    if (a.lock >= 0 && !B.gone[a.lock]) {
      const fl = G.flash['lock' + a.id] && now - G.flash['lock' + a.id] < 500;
      const r = s * 0.26, bx = tx, by = ty;
      ctx.fillStyle = fl ? C.bad : C.lock; ctx.strokeStyle = fl ? C.bad : C.lock; ctx.lineWidth = Math.max(1.5, s * 0.06);
      ctx.beginPath(); ctx.arc(bx, by - r * 0.35, r * 0.48, Math.PI, 0); ctx.stroke();
      roundRect(ctx, bx - r * 0.75, by - r * 0.3, r * 1.5, r * 1.2, r * 0.25); ctx.fill();
      ctx.fillStyle = C.panel; ctx.font = `700 ${Math.max(8, s * 0.26)}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(a.tag + 1), bx, by + r * 0.32);
    }
    if (a.keyTag >= 0) {
      const r = s * 0.24;
      ctx.fillStyle = C.lock; ctx.beginPath(); ctx.arc(tx, ty, r, 0, 7); ctx.fill();
      ctx.fillStyle = C.panel; ctx.font = `700 ${Math.max(8, s * 0.26)}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(a.keyTag + 1), tx, ty + 1);
      ctx.strokeStyle = C.lock; ctx.lineWidth = Math.max(1.5, s * 0.07);
      ctx.beginPath(); ctx.moveTo(tx + r * 0.7, ty + r * 0.7); ctx.lineTo(tx + r * 1.5, ty + r * 1.5); ctx.lineTo(tx + r * 1.15, ty + r * 1.85); ctx.stroke();
    }
    if (a.fuse && !moving) {
      const left = G.fuseLeft[a.id], m = at(pts, Math.max(0, t + n - 1)), r = s * 0.24, hot = left <= 2;
      const fx = X(m[0]), fy = Y(m[1]);
      ctx.fillStyle = hot ? C.bad : C.panel; ctx.strokeStyle = C.bad; ctx.lineWidth = Math.max(1.5, s * 0.06);
      const pr = hot && !reduceMotion ? 1 + Math.sin(now / 120) * 0.08 : 1;
      ctx.beginPath(); ctx.arc(fx, fy, r * pr, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hot ? C.panel : C.bad; ctx.font = `700 ${Math.max(8, s * 0.27)}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(left), fx, fy + 1);
    }
    if (a.id === target && !an) {
      const pulse = reduceMotion ? 0.5 : (Math.sin(now / 260) + 1) / 2;
      ctx.strokeStyle = C.hint; ctx.globalAlpha = 0.25 + 0.45 * (1 - pulse); ctx.lineWidth = Math.max(1.5, s * 0.06);
      ctx.beginPath(); ctx.arc(X(h[0]), Y(h[1]), s * (0.55 + 0.25 * pulse), 0, 7); ctx.stroke();
    }
    ctx.restore();
  }

  // particles, ripples, floating text
  for (let i = G.ripples.length - 1; i >= 0; i--) {
    const r = G.ripples[i], p = (now - r.t0) / 900;
    if (p >= 1) { G.ripples.splice(i, 1); continue; }
    ctx.strokeStyle = C.acc; ctx.globalAlpha = 1 - p; ctx.lineWidth = Math.max(2, s * 0.12 * (1 - p));
    ctx.beginPath(); ctx.arc(X(r.x), Y(r.y), p * Math.max(B.W, B.H) * s * 0.75, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt; if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5); ctx.fillStyle = p.color;
    if (p.sq) { ctx.save(); ctx.translate(X(p.x), Y(p.y)); ctx.rotate(p.rot += dt * 6); ctx.fillRect(-p.size * s / 2, -p.size * s / 4, p.size * s, p.size * s / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), Math.max(1, p.size * s), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (let i = G.floaters.length - 1; i >= 0; i--) {
    const f = G.floaters[i], p = (now - f.t0) / 900;
    if (p >= 1) { G.floaters.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - p * p; ctx.fillStyle = f.color;
    ctx.font = `700 ${Math.max(12, Math.min(20, s * 0.45))}px ${C.display}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, Math.max(30, Math.min(sw - 30, X(f.x))), Math.max(14, Y(f.y) - p * s * 1.2));
  }
  ctx.globalAlpha = 1;
  if (!mini.hidden) drawMini();
}

function drawMini() {
  const B = G.B, m = Math.max(2, Math.floor(96 / Math.max(B.W, B.H))), w = B.W * m, h = B.H * m;
  if (mini.width !== w * dpr || mini.height !== h * dpr) { mini.width = w * dpr; mini.height = h * dpr; mini.style.width = w + 'px'; mini.style.height = h + 'px'; }
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.fillStyle = C.panel; mctx.fillRect(0, 0, w, h);
  for (let i = 0; i < B.W * B.H; i++) {
    if (!B.mask[i]) continue;
    const x = (i % B.W) * m, y = ((i / B.W) | 0) * m, o = B.occ[i], t = B.tile[i];
    mctx.fillStyle = o >= 0 ? (B.arrows[o].color >= 0 ? C.g[B.arrows[o].color] : C.line) : t === T.STONE ? C.stone : t ? C.tile : C.panel2;
    mctx.fillRect(x, y, m, m);
  }
  mctx.strokeStyle = C.acc; mctx.lineWidth = 1.5;
  mctx.strokeRect(-view.x / view.s * m, -view.y / view.s * m, sw / view.s * m, sh / view.s * m);
}

// ======================================================= boot
readTokens();
show('menu');
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
